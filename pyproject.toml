[project]
name = "reference-points"
version = "0.1.0"
description = "A citation grammar for pointing at exact blocks of a chat message — resolve or fail loudly, never silently mis-resolve."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
reference-points = "reference_points.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.10",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py313"
preview = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "ERA", "PL", "RUF", "FA", "TCH", "ASYNC", "S"]
ignore = ["line-too-long"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["assert", "magic-value-comparison"]

[tool.pyright]
strict = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
